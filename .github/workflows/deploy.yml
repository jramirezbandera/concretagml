# Concreta GML — publicación en GitHub Pages.
#
# Qué hace: en cada push a `main`, corre la suite COMPLETA y, solo si pasa,
# construye el bundle y lo publica en https://jramirezbandera.github.io/concretagml/
#
# ── POR QUÉ LOS TESTS SON UN GATE Y NO UN JOB APARTE ─────────────────────────
# `spec/SPEC.md` §6 exige «tests en verde» para dar por hecho cualquier feature.
# Si el despliegue no dependiera de ellos, la regla se cumpliría en la máquina
# de quien programa y no en lo que ve el usuario — que es donde importa. Con
# `needs:`, una suite roja deja publicada la versión anterior en vez de una rota.
#
# ── LO QUE ESTE WORKFLOW VIGILA Y NO ES OBVIO ───────────────────────────────
# Corre en LINUX y el desarrollo es en Windows, así que de paso es el único
# sitio donde se comprueba que el proyecto no depende del sistema de ficheros de
# Windows: el envoltorio `scripts/vitest.mjs` (que existe por un bug de casing
# de unidad, `e:` vs `E:`, que solo se da en Windows) y la guarda de partición de
# `test/contrato.test.js` (que recorre `test/` con `node:fs` y traduce globs)
# son los dos candidatos a comportarse distinto. Si algún día CI falla y local
# no, mirar ahí primero.

name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite relanzar el despliegue a mano sin tener que empujar un commit vacío.
  workflow_dispatch:

# Los que exige `actions/deploy-pages`: `pages` para publicar y `id-token` para
# que el despliegue se autentique sin secretos de larga vida.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. `cancel-in-progress: false` a propósito: cancelar un
# despliegue A MEDIAS puede dejar Pages en un estado intermedio. Se deja
# terminar y el siguiente espera.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    name: Suite completa (node + dom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci`, no `npm install`: instala EXACTAMENTE el lockfile y falla si
      # ha divergido de package.json, en vez de resolver versiones nuevas por su
      # cuenta. Un despliegue no es el sitio donde descubrir una dependencia
      # actualizada.
      - run: npm ci

      # Los DOS proyectos de Vitest (`node` y `dom`). El script `test` ya los
      # corre ambos; `test:node` es solo el bucle rápido de desarrollo.
      - name: npm test
        run: npm test

  esquema:
    name: Validar contra el XSD oficial de INSPIRE
    needs: pruebas
    runs-on: ubuntu-latest
    # ⚠️ ESTE JOB EXISTE POR UN FALLO CONCRETO, y conviene que se lea aquí.
    #
    # El 2026-07-27 la Sede rechazó el GML que produce la app («El archivo no
    # cumple el esquema Inspire GML») con la suite en verde y 1.784 pruebas. La
    # validación de esquema existía —`npm run validar:xsd`— pero era OPCIONAL y
    # dependía de tener `xmllint` instalado; en la máquina de desarrollo no lo
    # estaba, así que salía SALTADO con código 0 y no se ejecutó NUNCA.
    #
    # La lección no es «había que instalar xmllint»: es que un guardián que puede
    # saltarse a sí mismo en silencio no protege de nada. Aquí corre con
    # `--estricto`, en una máquina donde las herramientas SÍ están, y no poder
    # validar es un fallo en vez de un salto.
    #
    # Va DESPUÉS de `pruebas` porque necesita el snapshot que genera la suite, y
    # ANTES de publicar (`construir` depende de él): un GML que no valida contra
    # el esquema oficial no se pone en manos de nadie.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `lxml` trae libxml2 dentro: el mismo motor que `xmllint`. Se instala en
      # vez de usar `libxml2-utils` porque el script cachea en disco los XSD que
      # descarga, y eso solo lo hace por la vía de Python.
      - run: pip install lxml

      - run: npm ci

      # El snapshot del round-trip lo escribe la suite (`toMatchFileSnapshot`),
      # así que hay que generarlo antes de validarlo. Solo el proyecto `node`:
      # los tests de GML viven ahí y jsdom no pinta nada en esto.
      - name: Generar los snapshots de GML
        run: npm run test:node

      - name: npm run validar:xsd -- --estricto
        run: npm run validar:xsd -- --estricto

  construir:
    name: Construir el bundle
    needs: esquema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # El `base` de `vite.config.js` (`/concretagml/`) es lo que hace que las
      # URL del bundle apunten dentro del proyecto de Pages. Sin él la página
      # sale en blanco con 404 en los assets.
      - name: npm run build
        run: npm run build

      # Guardia de humo del artefacto, antes de publicarlo. Comprueba las dos
      # cosas que dejarían la página en blanco sin que nada más avisara:
      # que el HTML referencia los assets BAJO el base, y que no queda ninguna
      # ruta absoluta fuera de él.
      - name: Comprobar que el bundle está preparado para la subruta
        run: |
          set -euo pipefail
          if ! grep -q 'src="/concretagml/assets/' dist/index.html; then
            echo "::error::dist/index.html no referencia los assets bajo /concretagml/. ¿Se ha perdido el 'base' de vite.config.js?"
            exit 1
          fi
          sueltas=$(grep -oE '"/[^"]*"' dist/index.html | grep -v '^"/concretagml/' || true)
          if [ -n "$sueltas" ]; then
            echo "::error::Rutas absolutas fuera del base (darían 404 en Pages):"
            echo "$sueltas"
            exit 1
          fi
          echo "OK: el bundle apunta dentro de /concretagml/"

      # ── El presupuesto de la hoja de estilo (rework T10) ──────────────────
      # Va aquí y no en `pruebas` porque se mide sobre el ARTEFACTO: la cifra
      # presupuestada es la hoja construida con los comentarios ya comidos, no
      # el fichero fuente (que es sobre todo registro de diseño y mide 3× más).
      #
      # Es un GATE, con la misma lógica que el job `esquema`: la hoja creció de
      # 16.684 a 42.064 B en nueve fases sin que nadie publicara un número, y un
      # presupuesto que no puede parar nada es una intención. Ponerlo en verde
      # cuesta una línea —añadir el asiento en `scripts/presupuesto-css.mjs`—,
      # y el techo del criterio 10 ni siquiera se exige hasta que las cinco
      # rebanadas estén cerradas.
      #
      # ✅ MEDIDO EL 2026-08-04, en la primera corrida (run 30926258304): Linux
      # da **exactamente** los mismos bytes que Windows —61.108 / 46.013 /
      # 15.095—, así que los asientos son portables y el fin de línea de la
      # fuente no sobrevive al minificador. Se deja escrito porque durante unas
      # horas fue un razonamiento y no una medición, y la diferencia importa:
      # si algún día sale rojo por unos pocos bytes, este párrafo dice que el
      # sospechoso NO es la plataforma.
      - name: npm run presupuesto
        run: npm run presupuesto

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
