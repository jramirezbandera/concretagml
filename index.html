<!doctype html>
<!--
  Concreta GML — index.html · F03 · Fase 4, Tarea 4B.1. LA CÁSCARA VIVA DE LA APP.

  Sustituye la sonda de build de la tarea 4A.1. Aquí ya no hay andamiaje: este es
  el esqueleto definitivo de la pantalla única de la app.

  ── QUÉ ES ESTE FICHERO, EXACTAMENTE ────────────────────────────────────────
  Un ESQUELETO DE CAJAS VACÍAS, y nada más. No pinta contenido dinámico: el
  interior de `#avisos` es de `app/avisos.js`, el de `#tabla-vertices` y el de
  `#mapa` es de `viewer/` (`sincronizar` y `crearVisor`), y los textos de la
  ficha del pie los escribe `app/main.js` desde el store. Lo único que este HTML
  aporta son los NODOS y sus clases.

  ⚠️ EL MARCADO ES CONTRATO, NO SUGERENCIA. `estilos/app.css` está escrito
  contra este esqueleto exacto (clases `gml-*`, anidamiento y orden incluidos).
  Si se renombra una clase o se mueve un nodo de nivel, el CSS deja de aplicar
  sin que nada avise. Antes de tocar la estructura, leer la cabecera de
  `estilos/app.css`.

  Dos trampas concretas, ya pisadas y documentadas:

  · `#tabla-vertices` TIENE que ser un `<div>` y no un `<table>`. Ese `<div>` es
    el contenedor con `overflow:auto` (`.gml-tabla-caja`) contra el que scrollea
    la cabecera pegajosa de la tabla; si aquí hubiera un `<table>`,
    `viewer/sincronizacion.js` lo usaría como tabla raíz (su contrato lo admite)
    y desaparecerían el scroll y el `position:sticky` del `<thead>`.

  · Los rótulos van SIEMPRE FUERA de las cajas vacías. `sincronizar` hace
    `tablaEl.replaceChildren()` en cada repintado, así que cualquier cosa que se
    meta dentro de `#tabla-vertices` se borra al primer `set` del store. Por eso
    «Vértices · X · Y (m)» vive en un `.gml-rotulo-fila` HERMANO.

  ── LOS CHIPS DEL CONTADOR ──────────────────────────────────────────────────
  `.gml-chip` a secas ES el chip neutro (gris) de la maqueta; `--error` y
  `--aviso` solo AÑADEN color. Los dos `<span>` nacen aquí SIN modificador y con
  el texto de cuenta cero: un chip rojo diciendo «0 errores» sería peor que no
  tener chip. Quien pone y quita el modificador es `app/avisos.js`, que los
  recibe por `data-contador`. El punto de color lo pinta un `::before` del CSS,
  así que aquí NO va ningún `<span>` de punto (saldrían dos), y por eso mismo
  `chip.textContent = '3 errores'` no lo borra.

  ── EL CSS: QUÉ SE CARGA AQUÍ Y QUÉ SE CARGA DESDE EL JS ────────────────────
  · `estilos/app.css` (que hace `@import` de los cinco ficheros de tokens) va
    como `<link>` EN LA CABECERA, no importado desde `app/main.js`. Motivo: así
    la cáscara está vestida en el PRIMER pintado. Importándola desde el módulo
    de entrada, en `npm run dev` la hoja llega después de evaluar el JS y se ve
    un fogonazo de HTML sin estilo en cada recarga.
  · `leaflet/dist/leaflet.css` lo importa `app/main.js`, que es el módulo que
    depende de Leaflet (`viewer/` NO lo importa a propósito: es una librería, y
    el CSS es responsabilidad de la entrada de la aplicación).
  · El ORDEN entre las dos hojas es indiferente Y ESO ES DELIBERADO, no suerte:
    todas las reglas de `estilos/app.css` que pisan cromo de Leaflet llevan
    `.gml-app .gml-mapa` delante (0,3,0) precisamente para ganar la cascada
    venga leaflet.css antes o después. Comprobado en pantalla en dev y sobre el
    bundle de `vite preview`, que es donde el orden podría diferir.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concreta GML — validación del recinto</title>
    <!-- Favicon SVG en línea (una línea, sin fichero ni petición): el recinto en el
         amarillo de `viewer/_comun.js#COLOR_USUARIO`. Sin él, la pestaña sale con el
         icono roto. El recinto va AMARILLO SOBRE FONDO OSCURO (no al revés): una
         pestaña es fondo claro, y un cuadro amarillo con trazo blanco encima
         desaparecería — el mismo problema de contraste que resuelve
         `--gml-color-usuario-sobre-claro` en la tabla. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230F172A'/><path d='M7.5 22.5 11.5 8.5 24.5 11.5 21 24.5Z' fill='none' stroke='%23FFD600' stroke-width='2.3' stroke-linejoin='round'/></svg>" />
    <link rel="stylesheet" href="/estilos/app.css" />
  </head>

  <body class="gml-app">
    <aside class="gml-panel">
      <header class="gml-panel-cabecera">
        <!-- `app/main.js` reescribe este texto SIEMPRE, desde el suscriptor de la
             ficha, con tres estados: «Parcela de demostración», «Parcela sintética ·
             demostración» (?demo=hueco) y «Parcela del Catastro» (traída por F05).
             Antes solo lo tocaba para el caso sintético; desde que se puede traer
             una parcela real, callar la procedencia sería maquillarla. -->
        <p class="gml-eyebrow" data-eyebrow>Parcela cargada</p>
        <h1 class="gml-titulo">Validación del recinto</h1>
        <div class="gml-chips">
          <span class="gml-chip" data-contador="ERROR">0 errores</span>
          <span class="gml-chip" data-contador="AVISO">0 avisos</span>
        </div>
      </header>

      <!-- ── DE DÓNDE VIENE EL DATO: la parcela del Catastro (F05) ────────────
           Es la PRIMERA sección del panel, y el orden es una decisión, no el
           azar de haberla escrito la última: la primera acción de quien abre la
           app es traer una parcela. Así el panel se lee de arriba abajo como el
           trabajo real — de dónde viene el dato → qué problemas tiene → sus
           vértices → qué se hace con ella.

           `data-campo`, `data-accion`, `data-estado`, `data-procedencia` y
           `data-candidatos` son el CONTRATO con `app/cableado-catastro.js`, que
           busca estos nodos y LANZA si falta alguno (igual que `app/main.js`
           con los del pie). Renombrar uno aquí rompe ese módulo, no esta página.

           EL BOTÓN DE DEDUCIR NACE DESHABILITADO, por el mismo motivo que el de
           «Generar GML» del pie: deducir la referencia solo tiene sentido
           cuando ya hay geometría SIN referencia, y ofrecerlo antes prometería
           algo que no se puede cumplir. Quien lo enciende —y quien escribe el
           motivo cuando no lo enciende— es el cableado, no este fichero.

           Los tres nodos de abajo son CAJAS VACÍAS y por eso no llevan texto
           dentro (ver la segunda trampa de la cabecera): el JS los repinta, así
           que cualquier rótulo metido ahí desaparecería al primer repintado. La
           lista de candidatos nace además `hidden`: una lista visible y vacía
           afirmaría que la deducción no encontró nada, que es otra cosa muy
           distinta de que todavía no se haya deducido. -->
      <section class="gml-bloque gml-bloque--catastro">
        <h2 class="gml-rotulo">Origen de la parcela</h2>

        <div class="gml-campo">
          <label class="gml-campo-etiqueta" for="campo-refcat">Referencia catastral</label>
          <div class="gml-campo-fila">
            <!-- Monoespaciada (`gml-mono`) a propósito: son caracteres
                 alfanuméricos que el usuario coteja UNO A UNO contra un papel, y
                 en proporcional la O y el 0, o la I y el 1, se confunden. El
                 autocompletado y el corrector ortográfico no tienen nada que
                 aportar sobre un código y solo estorban.

                 ⛔ SIN `maxlength`, y es deliberado (2026-07-28). Tenía
                 `maxlength="14"` y era un FALLO SILENCIOSO: recortaba lo pegado
                 antes de que nadie lo mirase. Quien pegaba `9398516 VK3799G`
                 —con el espacio con el que la Sede imprime las referencias, que
                 `normalizarRefcat` tolera a propósito— perdía el último
                 carácter y recibía «no tiene forma de referencia catastral» por
                 una referencia correcta. Y la de INMUEBLE (20 caracteres, la de
                 los recibos del IBI) solo funcionaba por accidente, porque el
                 truncado se quedaba justo con sus 14 primeros.
                 Ahora el campo no altera nada y quien valida y explica es
                 `normalizarRefcat`, que acepta las dos formas. Lo detectó el
                 guion de humo `07`. -->
            <input
              id="campo-refcat"
              class="gml-entrada gml-mono"
              type="text"
              data-campo="refcat"
              autocomplete="off"
              spellcheck="false"
              placeholder="29041A00800099"
            />
            <button
              type="button"
              class="gml-boton gml-boton--primario"
              data-accion="cargar-catastro"
            >
              Traer del Catastro
            </button>
          </div>
        </div>

        <button
          type="button"
          class="gml-boton gml-boton--secundario"
          data-accion="deducir-refcat"
          disabled
        >
          Deducir del mapa
        </button>

        <!-- El desenlace de la acción. `role="status"` para que el lector de
             pantalla lo anuncie SIN robar el foco, igual que el renglón de
             «Generar GML»: el usuario sigue con las manos en el campo. -->
        <p class="gml-accion-estado" data-estado="cargar-catastro" role="status"></p>

        <ul class="gml-candidatos" data-candidatos="refcat" hidden></ul>

        <!-- De dónde salió el dato y su antigüedad («del Catastro · guardado
             hace 6 días»). Es lo único que impide que un dato viejo sacado de la
             caché se presente como recién traído de la Sede. -->
        <p class="gml-procedencia" data-procedencia="parcela"></p>
      </section>

      <!-- El modificador `--avisos` NO es decorativo: es lo que permite que este
           bloque CEDA altura. Lo añadió F05 al medir que su bloque nuevo de
           «Origen de la parcela» sumaba ~137 px fijos a un presupuesto fijo, y
           que con la lista de avisos llena por debajo de ~775 px de viewport el
           pie del panel —y con él «Generar GML»— se salía por abajo. Ver la
           regla en `estilos/app.css`. -->
      <section class="gml-bloque gml-bloque--avisos">
        <h2 class="gml-rotulo">Avisos</h2>
        <!-- Caja VACÍA: su interior es de `app/avisos.js`. Tope de alto y scroll propio
             los pone `.gml-avisos` (--gml-avisos-alto-max), para que una tanda larga de
             hallazgos de F02 no empuje la tabla ni el pie fuera del panel. -->
        <div id="avisos" class="gml-avisos"></div>
      </section>

      <section class="gml-bloque gml-bloque--vertices">
        <!-- El rótulo va FUERA de la caja: `sincronizar` vacía `#tabla-vertices`.
             El segundo hijo no necesita clase (hereda 11 px y gris de la fila). -->
        <div class="gml-rotulo-fila">
          <h2 class="gml-rotulo">Vértices</h2>
          <span>X · Y (m)</span>
        </div>
        <!-- Caja VACÍA, y `<div>` a propósito (ver cabecera): su interior lo genera
             `viewer/sincronizacion.js` y el scroll con cabecera pegajosa es de este div. -->
        <div id="tabla-vertices" class="gml-tabla-caja"></div>
      </section>

      <!-- La ficha del expediente: SEGUNDO suscriptor del mismo store que el visor.
           Los `<dd>` los rellena `app/main.js`; los `data-ficha` son su contrato. -->
      <footer class="gml-panel-pie">
        <dl class="gml-ficha">
          <dt>Sistema de referencia</dt>
          <dd class="gml-mono" data-ficha="srs">—</dd>

          <dt>Referencia catastral</dt>
          <dd class="gml-mono" data-ficha="refcat">—</dd>

          <dt>Vértices</dt>
          <dd class="gml-mono" data-ficha="vertices">—</dd>

          <dt>Superficie</dt>
          <dd class="gml-mono" data-ficha="superficie">—</dd>

          <!-- Los dos de F05 vienen del Catastro, no de la geometría del
               usuario. «Superficie catastral» va JUSTO DEBAJO de «Superficie»
               para que las dos cifras se comparen de un vistazo: la discrepancia
               entre lo medido y lo inscrito es media razón de ser de la app. -->
          <dt>Superficie catastral</dt>
          <dd class="gml-mono" data-ficha="superficie-catastral">—</dd>

          <dt>Colindantes</dt>
          <dd class="gml-mono" data-ficha="colindantes">—</dd>
        </dl>

        <!-- ── La acción principal de la app (F04) ────────────────────────────
             El botón NACE DESHABILITADO, y es deliberado: hasta que `app/main.js`
             no ha validado la geometría no se sabe si se puede generar, y un
             botón pulsable antes de esa comprobación ofrecería generar un GML
             que quizá tenga errores bloqueantes. Es el mismo criterio por el que
             los chips nacen en «0 errores» sin color: el estado inicial dice la
             verdad, que es «todavía no se ha mirado». Quien lo habilita —y quien
             escribe el motivo cuando NO lo habilita— es `app/main.js`, a partir
             de `puedeGenerar` de `validation/parcela.js`.

             `data-accion` y `data-estado` son el contrato con `app/main.js`, que
             busca los nodos y LANZA si faltan. El `role="status"` hace que el
             lector de pantalla anuncie el resultado de la generación sin robar
             el foco: es la única superficie donde el usuario se entera de que se
             le ha redondeado una coordenada o invertido un anillo. -->
        <div class="gml-acciones">
          <button
            type="button"
            class="gml-boton gml-boton--primario"
            data-accion="generar-gml"
            disabled
          >
            Generar GML
          </button>
          <p class="gml-accion-estado" data-estado="generar-gml" role="status"></p>
        </div>
      </footer>
    </aside>

    <!-- Caja VACÍA: `crearVisor` monta aquí el `L.Map`. `.gml-mapa` y
         `.leaflet-container` acaban siendo EL MISMO nodo del DOM. -->
    <main id="mapa" class="gml-mapa"></main>

    <script type="module" src="/app/main.js"></script>
  </body>
</html>
